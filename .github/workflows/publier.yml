# Construit le site avec Quarto et le publie sur GitHub Pages à chaque
# poussée sur main. Vérifie aussi que le dépôt d'exercice passe ses tests.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests du dépôt d'exercice
        working-directory: depot-exercice
        run: uv run pytest -q
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Rendu
        run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
