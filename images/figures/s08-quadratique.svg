<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title id="titre">Temps d'indexation selon le nombre de documents</title>
  <desc id="desc">Temps d'indexation mesuré d'indexeur 0.3.0 : 138 ms pour 500 documents, 388 ms pour 1 000, 1,24 s pour 2 000, 4,40 s pour 4 000 et 16,6 s pour 8 000. Si le temps était proportionnel au nombre de documents, 8 000 documents prendraient environ 2,2 s. La courbe mesurée croît comme le carré du nombre de documents.</desc>
  <rect width="720" height="310" fill="#fcfcfb"/>
  <line x1="80" y1="250.0" x2="640" y2="250.0" stroke="#e6e5e0"/>
  <text x="70" y="254.0" text-anchor="end" fill="#52514e" font-size="12">0 s</text>
  <line x1="80" y1="191.7" x2="640" y2="191.7" stroke="#e6e5e0"/>
  <text x="70" y="195.7" text-anchor="end" fill="#52514e" font-size="12">5 s</text>
  <line x1="80" y1="133.3" x2="640" y2="133.3" stroke="#e6e5e0"/>
  <text x="70" y="137.3" text-anchor="end" fill="#52514e" font-size="12">10 s</text>
  <line x1="80" y1="75.0" x2="640" y2="75.0" stroke="#e6e5e0"/>
  <text x="70" y="79.0" text-anchor="end" fill="#52514e" font-size="12">15 s</text>
  <line x1="80" y1="250" x2="640" y2="250" stroke="#b9b8b2"/>
  <text x="80.0" y="270" text-anchor="middle" fill="#52514e" font-size="12">0</text>
  <text x="220.0" y="270" text-anchor="middle" fill="#52514e" font-size="12">2 000</text>
  <text x="360.0" y="270" text-anchor="middle" fill="#52514e" font-size="12">4 000</text>
  <text x="500.0" y="270" text-anchor="middle" fill="#52514e" font-size="12">6 000</text>
  <text x="640.0" y="270" text-anchor="middle" fill="#52514e" font-size="12">8 000</text>
  <text x="360.0" y="294" text-anchor="middle" fill="#52514e" font-size="12">nombre de documents (200 mots chacun)</text>
  <text x="70" y="24" text-anchor="end" fill="#52514e" font-size="12">temps</text>
  <line x1="80.0" y1="250.0" x2="640.0" y2="224.2" stroke="#52514e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="648.0" y="228.2" fill="#52514e" font-size="12">2,2 s</text>
  <text x="633.0" y="212.2" text-anchor="end" fill="#52514e" font-size="12">si le temps était linéaire</text>
  <polyline points="115.0,248.4 150.0,245.5 220.0,235.6 360.0,198.7 640.0,56.0" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <circle cx="115.0" cy="248.4" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="150.0" cy="245.5" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="220.0" cy="235.6" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="360.0" cy="198.7" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <circle cx="640.0" cy="56.0" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
  <text x="648.0" y="60.0" fill="#0b0b0b" font-size="12">16,6 s</text>
  <text x="350.0" y="188.7" text-anchor="end" fill="#0b0b0b" font-size="12">4,4 s</text>
  <text x="510.5" y="161.3" fill="#0b0b0b" font-size="12">mesuré : environ ×4</text>
  <text x="510.5" y="177.3" fill="#0b0b0b" font-size="12">quand on double</text>
</svg>
