<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title id="titre">Où l'indexation passe son temps</title>
  <desc id="desc">Graphe de flammes schématique de l'indexation de 2 000 documents, d'après les mesures directes : environ 1,27 s au total. termes et ses appels (normaliser, sans_accents) prennent environ 0,25 s. Le reste du temps d'Index.ajouter, environ 0,96 s, est son temps propre, presque entièrement dû à la ligne 30, le test identifiant in liste. Si cette ligne ne coûtait rien, l'indexation prendrait environ 0,31 s, soit un facteur 4.</desc>
  <rect width="720" height="330" fill="#fcfcfb"/>
  <rect x="60.0" y="210" width="599.0" height="24" rx="3" fill="#ffffff" stroke="#b9b8b2"/>
  <text x="67.0" y="226.5" fill="#0b0b0b" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">indexer()</text>
  <rect x="60.0" y="184" width="599.0" height="24" rx="3" fill="#ffffff" stroke="#b9b8b2"/>
  <text x="67.0" y="200.5" fill="#0b0b0b" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">Index.ajouter</text>
  <rect x="60.0" y="158" width="117.1" height="24" rx="3" fill="#ffffff" stroke="#b9b8b2"/>
  <text x="67.0" y="174.5" fill="#0b0b0b" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">termes</text>
  <rect x="60.0" y="132" width="106.7" height="24" rx="3" fill="#ffffff" stroke="#b9b8b2"/>
  <text x="67.0" y="148.5" fill="#0b0b0b" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">normaliser</text>
  <rect x="60.0" y="106" width="95.9" height="24" rx="3" fill="#ffffff" stroke="#b9b8b2"/>
  <text x="67.0" y="122.5" fill="#0b0b0b" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">sans_accents</text>
  <rect x="180.1" y="106" width="478.9" height="76" rx="3" fill="#eb6834" fill-opacity="0.1" stroke="#eb6834" stroke-dasharray="4 3"/>
  <text x="419.6" y="134" text-anchor="middle" fill="#0b0b0b">temps propre d'<tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">ajouter</tspan>, environ 0,96 s</text>
  <text x="419.6" y="154" text-anchor="middle" fill="#52514e" font-size="12">presque tout à la ligne 30 : <tspan font-family="ui-monospace, Menlo, Consolas, monospace">identifiant in self.postings[terme]</tspan></text>
  <text x="119.1" y="96" text-anchor="middle" fill="#52514e" font-size="12">environ 0,25 s</text>
  <line x1="60" y1="244" x2="660.0" y2="244" stroke="#b9b8b2"/>
  <line x1="60.0" y1="244" x2="60.0" y2="248" stroke="#b9b8b2"/>
  <text x="60.0" y="262" text-anchor="middle" fill="#52514e" font-size="12">0</text>
  <line x1="296.2" y1="244" x2="296.2" y2="248" stroke="#b9b8b2"/>
  <text x="296.2" y="262" text-anchor="middle" fill="#52514e" font-size="12">0,5 s</text>
  <line x1="532.4" y1="244" x2="532.4" y2="248" stroke="#b9b8b2"/>
  <text x="532.4" y="262" text-anchor="middle" fill="#52514e" font-size="12">1 s</text>
  <line x1="660.0" y1="244" x2="660.0" y2="248" stroke="#b9b8b2"/>
  <text x="660.0" y="262" text-anchor="middle" fill="#52514e" font-size="12">1,27 s</text>
  <text x="60" y="294" fill="#52514e" font-size="12">Amdahl : si la ligne 30 ne coûtait rien, 1,27 s deviendrait environ 0,31 s, soit un facteur 4.</text>
  <text x="60" y="34" fill="#52514e" font-size="12">Largeur proportionnelle au temps, d'après les mesures directes. Chaque case appelle celles qui sont au-dessus.</text>
</svg>
