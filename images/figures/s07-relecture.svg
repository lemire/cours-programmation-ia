<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title id="titre">L'ordre de relecture d'un diff</title>
  <desc id="desc">Cinq étapes, de la moins coûteuse à la plus coûteuse : vue d'ensemble (git diff --stat), les tests, les dépendances et la configuration, le code dans l'ordre des dépendances, l'exécution. Chaque étape peut mener au refus : git restore, corriger la fiche de tâche, relancer une session neuve. Seul un diff qui franchit les cinq étapes est accepté.</desc>
  <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
  <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e34948"/></marker>
  <marker id="fv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#008300"/></marker></defs>
  <rect width="800" height="280" fill="#fcfcfb"/>
  <line x1="16" y1="44" x2="704" y2="44" stroke="#52514e" stroke-width="1.5" marker-end="url(#f)"/>
  <text x="16" y="34" fill="#52514e" font-size="12">de la vérification la moins coûteuse à la plus coûteuse : on s'arrête au premier problème grave</text>
  <rect x="16" y="78" width="128" height="78" rx="6" fill="#ffffff" stroke="#b9b8b2"/>
  <text x="26" y="100" fill="#52514e" font-size="12">1</text>
  <text x="38" y="100" fill="#0b0b0b">Vue d'ensemble</text>
  <text x="26" y="124" fill="#52514e" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">git diff --stat</text>
  <text x="26" y="142" fill="#52514e" font-size="12">hors périmètre?</text>
  <line x1="145" y1="117.0" x2="155" y2="117.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#f)"/>
  <line x1="80.0" y1="158" x2="80.0" y2="204" stroke="#e34948" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fr)"/>
  <rect x="156" y="78" width="128" height="78" rx="6" fill="#ffffff" stroke="#b9b8b2"/>
  <text x="166" y="100" fill="#52514e" font-size="12">2</text>
  <text x="178" y="100" fill="#0b0b0b">Les tests</text>
  <text x="166" y="124" fill="#52514e" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">git diff tests/</text>
  <text x="166" y="142" fill="#52514e" font-size="12">affaiblis? sautés?</text>
  <line x1="285" y1="117.0" x2="295" y2="117.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#f)"/>
  <line x1="220.0" y1="158" x2="220.0" y2="204" stroke="#e34948" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fr)"/>
  <rect x="296" y="78" width="128" height="78" rx="6" fill="#ffffff" stroke="#b9b8b2"/>
  <text x="306" y="100" fill="#52514e" font-size="12">3</text>
  <text x="318" y="100" fill="#0b0b0b">Dépendances</text>
  <text x="306" y="124" fill="#52514e" font-size="12">pyproject.toml,</text>
  <text x="306" y="142" fill="#52514e" font-size="12">uv.lock, CI</text>
  <line x1="425" y1="117.0" x2="435" y2="117.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#f)"/>
  <line x1="360.0" y1="158" x2="360.0" y2="204" stroke="#e34948" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fr)"/>
  <rect x="436" y="78" width="128" height="78" rx="6" fill="#ffffff" stroke="#b9b8b2"/>
  <text x="446" y="100" fill="#52514e" font-size="12">4</text>
  <text x="458" y="100" fill="#0b0b0b">Le code</text>
  <text x="446" y="124" fill="#52514e" font-size="12">dans l'ordre des</text>
  <text x="446" y="142" fill="#52514e" font-size="12">dépendances</text>
  <line x1="565" y1="117.0" x2="575" y2="117.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#f)"/>
  <line x1="500.0" y1="158" x2="500.0" y2="204" stroke="#e34948" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fr)"/>
  <rect x="576" y="78" width="128" height="78" rx="6" fill="#ffffff" stroke="#b9b8b2"/>
  <text x="586" y="100" fill="#52514e" font-size="12">5</text>
  <text x="598" y="100" fill="#0b0b0b">Exécution</text>
  <text x="586" y="124" fill="#52514e" font-size="12">suite complète,</text>
  <text x="586" y="142" fill="#52514e" font-size="12">essai à la main</text>
  <line x1="640.0" y1="158" x2="640.0" y2="204" stroke="#e34948" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#fr)"/>
  <line x1="705" y1="117.0" x2="756" y2="117.0" stroke="#008300" stroke-width="1.5"/>
  <line x1="756" y1="117.0" x2="756" y2="204" stroke="#008300" stroke-width="1.5" marker-end="url(#fv)"/>
  <rect x="716" y="208" width="80" height="32" rx="6" fill="#ffffff" stroke="#008300"/>
  <text x="756" y="228.5" text-anchor="middle" fill="#0b0b0b">accepter</text>
  <rect x="16" y="208" width="688" height="32" rx="6" fill="#ffffff" stroke="#e34948"/>
  <text x="28" y="228.5" fill="#0b0b0b">refuser : <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">git restore .</tspan><tspan fill="#52514e">, corriger la fiche de tâche, relancer une session neuve</tspan></text>
  <text x="16" y="266" fill="#52514e" font-size="12">Accepter une partie seulement : git add -p.</text>
</svg>
