<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title id="titre">Productivité : impressions et mesures</title>
  <desc id="desc">Étude du METR : les participants prévoyaient d'aller 24 % plus vite, croyaient après coup être allés 20 % plus vite, et ont été mesurés 19 % plus lents. Étude de Peng et coll. sur une tâche neuve et isolée : 55,8 % plus vite, mesuré.</desc>
  <rect width="720" height="300" fill="#fcfcfb"/>

  <!-- Légende -->
  <rect x="290" y="14" width="14" height="10" rx="2" fill="#b9b8b2"/>
  <text x="310" y="24" fill="#0b0b0b">impression</text>
  <rect x="400" y="14" width="14" height="10" rx="2" fill="#2a78d6"/>
  <text x="420" y="24" fill="#0b0b0b">mesure</text>

  <!-- Grille -->
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="333.3" y1="44" x2="333.3" y2="224"/>
    <line x1="506.7" y1="44" x2="506.7" y2="224"/>
    <line x1="593.3" y1="44" x2="593.3" y2="224"/>
    <line x1="680" y1="44" x2="680" y2="224"/>
  </g>
  <line x1="420" y1="44" x2="420" y2="224" stroke="#52514e" stroke-width="1"/>

  <!-- Libellés des lignes -->
  <g fill="#0b0b0b" text-anchor="end">
    <text x="276" y="65">METR, prévision avant l'étude</text>
    <text x="276" y="103">METR, impression après coup</text>
    <text x="276" y="141">METR, temps mesuré</text>
    <text x="276" y="199">Peng et coll., temps mesuré</text>
  </g>
  <g fill="#52514e" font-size="12" text-anchor="end">
    <text x="276" y="160">leurs propres dépôts, matures</text>
    <text x="276" y="218">tâche neuve et isolée</text>
  </g>
  <line x1="40" y1="176" x2="690" y2="176" stroke="#e4e3df" stroke-width="1"/>

  <!-- Barres (0 % en x = 420; 1 point = 4,333 px) -->
  <rect x="420" y="50" width="104" height="20" rx="3" fill="#b9b8b2"/>
  <rect x="420" y="88" width="86.7" height="20" rx="3" fill="#b9b8b2"/>
  <rect x="337.7" y="126" width="82.3" height="20" rx="3" fill="#2a78d6"/>
  <rect x="420" y="184" width="241.8" height="20" rx="3" fill="#2a78d6"/>

  <!-- Valeurs -->
  <g fill="#0b0b0b" font-size="12">
    <text x="530" y="65">+24 %</text>
    <text x="512" y="103">+20 %</text>
    <text x="426" y="141">−19 %</text>
    <text x="667" y="199">+55,8 %</text>
  </g>

  <!-- Axe -->
  <g fill="#52514e" font-size="12" text-anchor="middle">
    <text x="333.3" y="242">−20 %</text>
    <text x="420" y="242">0</text>
    <text x="506.7" y="242">+20 %</text>
    <text x="593.3" y="242">+40 %</text>
    <text x="680" y="242">+60 %</text>
  </g>
  <text x="420" y="270" text-anchor="middle" fill="#52514e" font-size="12">variation de la vitesse avec l'outil d'IA (à droite de 0 : plus rapide)</text>
</svg>
