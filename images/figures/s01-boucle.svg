<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title id="titre">La boucle d'un agent de codage</title>
  <desc id="desc">Le contexte alimente le modèle; le modèle demande un outil (lire, chercher, modifier, exécuter); le résultat retourne dans le contexte. La boucle s'arrête quand le modèle le décide. Rien dans la boucle ne vérifie le résultat : tests, mesures et relecture sont ajoutés par vous.</desc>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="720" height="340" fill="#fcfcfb"/>

  <g fill="#ffffff" stroke="#b9b8b2" stroke-width="1">
    <rect x="30" y="80" width="190" height="150" rx="6"/>
    <rect x="290" y="125" width="140" height="60" rx="6" stroke="#2a78d6" stroke-width="1.5"/>
    <rect x="500" y="80" width="190" height="150" rx="6"/>
    <rect x="290" y="20" width="140" height="32" rx="6"/>
  </g>

  <g fill="#0b0b0b">
    <text x="46" y="104">Contexte</text>
    <text x="360" y="160" text-anchor="middle">Modèle</text>
    <text x="516" y="104">Outils</text>
    <text x="360" y="41" text-anchor="middle">« C'est fait. »</text>
  </g>
  <g fill="#52514e" font-size="12">
    <text x="46" y="130">instructions système</text>
    <text x="46" y="150">description des outils</text>
    <text x="46" y="170">votre demande</text>
    <text x="46" y="190">fichiers lus</text>
    <text x="46" y="210">sorties des commandes</text>
    <text x="516" y="130">lire un fichier</text>
    <text x="516" y="150">chercher</text>
    <text x="516" y="170">modifier un fichier</text>
    <text x="516" y="190">exécuter une commande</text>
  </g>

  <g fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#fleche)">
    <path d="M222 155 L286 155"/>
    <path d="M432 155 L496 155"/>
    <path d="M360 123 L360 56"/>
    <path d="M595 232 C595 290 125 290 125 232"/>
  </g>
  <g fill="#52514e" font-size="12">
    <text x="464" y="146" text-anchor="middle">appel</text>
    <text x="352" y="72" text-anchor="end">le modèle décide d’arrêter</text>
    <text x="360" y="300" text-anchor="middle">le résultat s'ajoute au contexte</text>
  </g>

  <text x="360" y="328" text-anchor="middle" fill="#52514e" font-size="12">Rien dans la boucle ne vérifie le travail : tests, mesures et relecture viennent de vous.</text>
</svg>
