<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">
  <title id="titre">Temps d'indexation avant et après la correction de la ligne 30</title>
  <desc id="desc">Échelles logarithmiques. Avant : 138,4 ms à 500 documents, 388,3 ms à 1 000, 1 237,0 ms à 2 000, 4 395,3 ms à 4 000, 16 625,7 ms à 8 000; le temps quadruple quand la taille double. Après : 76,4 ms, 149,9 ms, 304,4 ms, 613,1 ms, 1 257,2 ms; le temps double quand la taille double. Le gain passe de 1,8 à 13,2.</desc>
  <rect width="720" height="340" fill="#fcfcfb"/>

  <!-- Grille et axes -->
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="80" y1="252.2" x2="620" y2="252.2"/>
    <line x1="80" y1="160" x2="620" y2="160"/>
    <line x1="80" y1="67.8" x2="620" y2="67.8"/>
  </g>
  <line x1="80" y1="280" x2="620" y2="280" stroke="#b9b8b2"/>
  <g fill="#52514e" text-anchor="end">
    <text x="72" y="256">100 ms</text>
    <text x="72" y="164">1 s</text>
    <text x="72" y="72">10 s</text>
  </g>
  <g fill="#52514e" text-anchor="middle">
    <text x="80" y="298">500</text>
    <text x="215" y="298">1 000</text>
    <text x="350" y="298">2 000</text>
    <text x="485" y="298">4 000</text>
    <text x="620" y="298">8 000</text>
    <text x="350" y="322">documents indexés (échelles logarithmiques)</text>
  </g>

  <!-- Avant : quadratique -->
  <polyline points="80,239.2 215,197.9 350,151.5 485,100.7 620,47.4" fill="none" stroke="#eb6834" stroke-width="2"/>
  <g fill="#eb6834" stroke="#fcfcfb" stroke-width="2">
    <circle cx="80" cy="239.2" r="4.5"/><circle cx="215" cy="197.9" r="4.5"/><circle cx="350" cy="151.5" r="4.5"/><circle cx="485" cy="100.7" r="4.5"/><circle cx="620" cy="47.4" r="4.5"/>
  </g>
  <!-- Après : linéaire -->
  <polyline points="80,263 215,236 350,207.6 485,179.6 620,150.8" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <g fill="#2a78d6" stroke="#fcfcfb" stroke-width="2">
    <circle cx="80" cy="263" r="4.5"/><circle cx="215" cy="236" r="4.5"/><circle cx="350" cy="207.6" r="4.5"/><circle cx="485" cy="179.6" r="4.5"/><circle cx="620" cy="150.8" r="4.5"/>
  </g>

  <!-- Étiquettes directes -->
  <g fill="#0b0b0b">
    <text x="632" y="44">16,6 s</text>
    <text x="632" y="155">1,26 s</text>
  </g>
  <g fill="#52514e">
    <text x="420" y="116" text-anchor="end">avant : ×4 quand la taille double</text>
    <text x="440" y="214">après : ×2 quand la taille double</text>
    <text x="632" y="102">gain ×13,2</text>
  </g>
  <line x1="626" y1="52" x2="626" y2="146" stroke="#b9b8b2" stroke-dasharray="3 3"/>

  <!-- Légende -->
  <g>
    <line x1="90" y1="24" x2="110" y2="24" stroke="#eb6834" stroke-width="2"/>
    <text x="116" y="28" fill="#0b0b0b">avant (recherche linéaire dans une liste)</text>
    <line x1="370" y1="24" x2="390" y2="24" stroke="#2a78d6" stroke-width="2"/>
    <text x="396" y="28" fill="#0b0b0b">après (Counter)</text>
  </g>
</svg>
