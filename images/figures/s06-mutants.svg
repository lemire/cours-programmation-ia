<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="titre desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13">
  <title id="titre">Mutants tués et survivants, par module</title>
  <desc id="desc">Avec la suite fournie, recherche.py, pourtant couvert à 100 %, laisse 21 mutants survivants sur 65. Après l'ajout des propriétés et du test différentiel, il n'en reste qu'un. Les survivants de cli.py (34) touchent surtout les textes d'aide. corpus.py passe de 45 mutants sans test à 22 survivants.</desc>
